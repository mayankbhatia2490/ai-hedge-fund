services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ai-hedge-fund-backend
    container_name: ai-hedge-fund-backend
    command: uvicorn app.backend.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ../.env:/app/.env
      - ../hedge_fund.db:/app/hedge_fund.db
    ports:
      - "4000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    image: ai-hedge-fund-frontend
    container_name: ai-hedge-fund-frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped
